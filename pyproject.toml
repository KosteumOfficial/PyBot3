[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybot3"
version = "0.1.1"
description = "A modular Python toolkit for building bots across multiple platforms."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PyBot3 Contributors" }]
license = { text = "AGPL-3.0-or-later" }
keywords = ["bot", "telegram", "discord", "whatsapp", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Topic :: Software Development :: Libraries",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "aiohttp>=3.9.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "build>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/KosteumOfficial/PyBot3"
Repository = "https://github.com/KosteumOfficial/PyBot3"
Issues = "https://github.com/KosteumOfficial/PyBot3/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
